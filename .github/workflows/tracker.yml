name: Bobingen Flight Tracker

on:
  workflow_dispatch: # Nur noch manuell auslösbar – VPS übernimmt den Cron

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flüge abfragen (mit Retry)
        run: |
          SUCCESS=false

          for attempt in 1 2 3; do
            echo ">>> Versuch $attempt/3..."

            HTTP_CODE=$(curl -s \
              --max-time 20 \
              -o response.json \
              -w "%{http_code}" \
              -u "${{ secrets.OPENSKY_USER }}:${{ secrets.OPENSKY_PASS }}" \
              "https://opensky-network.org/api/states/all?lamin=47.96&lomin=10.53&lamax=48.56&lomax=11.13")

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && python3 -c "import json; json.load(open('response.json'))" 2>/dev/null; then
              echo "Gültige Antwort erhalten."
              SUCCESS=true
              break
            fi

            echo "Fehlgeschlagen (HTTP $HTTP_CODE oder kein valides JSON)."
            if [ $attempt -lt 3 ]; then
              echo "Warte 15 Sekunden..."
              sleep 15
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "Alle 3 Versuche fehlgeschlagen – kein Datenpunkt gespeichert."
            exit 0
          fi

          python3 << 'EOF'
          import json, csv, os
          from datetime import datetime, timezone

          with open('response.json') as f:
              data = json.load(f)

          states = data.get('states') or []
          flights = [s for s in states if not s[8]]
          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M')

          os.makedirs('data', exist_ok=True)
          file = 'data/flights.csv'
          exists = os.path.exists(file)
          with open(file, 'a', newline='') as f:
              w = csv.writer(f)
              if not exists:
                  w.writerow(['timestamp', 'count', 'callsigns'])
              w.writerow([now, len(flights), '|'.join((s[1] or '').strip() for s in flights)])

          print(f"{now}: {len(flights)} Flugzeuge")
          EOF

      - name: Daten speichern
        run: |
          git config user.email "action@github.com"
          git config user.name "Flight Tracker Bot"
          git add data/flights.csv
          git diff --staged --quiet || git commit -m "Update: $(date -u '+%H:%M UTC')"
          git push
